<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高配当監視リスト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0}
header{padding:12px 16px;background:#1e293b;border-bottom:1px solid #334155;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:16px;font-weight:700;color:#f1f5f9}
.upd{font-size:11px;color:#64748b}
.bar{padding:10px 16px;background:#1e293b;border-bottom:1px solid #334155;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{padding:5px 11px;border-radius:6px;border:1px solid #475569;background:transparent;color:#94a3b8;cursor:pointer;font-size:12px}
.btn:hover{background:#334155;color:#e2e8f0}
.btn.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
.btn.bottom-btn{background:#7c3aed;border-color:#7c3aed;color:#fff}
.btn.bottom-btn:hover{background:#6d28d9}
.btn.best-btn{background:#f59e0b;border-color:#f59e0b;color:#000}
.btn.best-btn:hover{background:#d97706}
.btn.good-btn{background:#22c55e;border-color:#22c55e;color:#000}
.btn.good-btn:hover{background:#16a34a}
.sep{color:#475569;font-size:11px;padding:0 2px}
.srch-wrap{position:relative;display:inline-flex;align-items:center}
.srch{padding:5px 28px 5px 10px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:12px;width:150px}
.srch-clear{position:absolute;right:6px;background:none;border:none;cursor:pointer;color:#64748b;font-size:14px;line-height:1;padding:2px 3px;display:none}
.srch-clear:hover{color:#cbd5e1}
.cnt{font-size:12px;color:#64748b;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:14px 16px}
.card{background:#1e293b;border-radius:10px;border:1px solid #334155;overflow:hidden;display:flex;flex-direction:column}
.card.pri{border-color:#f59e0b}
.card.bottom_strong{border:2px solid #ef4444}
.card.bottom{border-color:#f97316}
.card.near_bottom{border-color:#eab308}
.c-head{padding:8px 12px;background:#0f172a;display:flex;justify-content:space-between;align-items:center;gap:6px}
.sec{font-size:10px;padding:2px 7px;border-radius:10px;background:#334155;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.bgs{display:flex;gap:4px;align-items:center;flex-shrink:0}
.bg-pri{font-size:11px;padding:1px 7px;border-radius:10px;background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b44}
.bg-sig{font-size:10px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.s-bottom_strong{background:#ef444422;color:#f87171;border:1px solid #ef444444}
.s-bottom      {background:#f9731622;color:#fb923c;border:1px solid #f9731644}
.s-near_bottom {background:#eab30822;color:#fbbf24;border:1px solid #eab30844}
.s-normal      {background:#33415522;color:#64748b;border:1px solid #33415544}
.s-no_data     {background:#1e293b;color:#475569;border:1px solid #33415544}
.c-body{padding:10px 12px;flex:1}
.sname{font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:1px}
.scode{font-size:11px;color:#64748b;margin-bottom:6px}
.info{font-size:11px;color:#94a3b8;line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;border-top:1px solid #334155;padding-top:8px}
.met{display:flex;flex-direction:column;gap:1px}
.ml{color:#64748b;font-size:10px}
.mv{color:#e2e8f0;font-weight:600}
.mv.div{color:#34d399}
.mv.rlo{color:#f87171}
.mv.rmd{color:#fbbf24}
.tbar{padding:8px 12px;background:#0f172a;border-top:1px solid #334155;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ti{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px}
.tl{color:#64748b;font-size:9px}
.tv{font-weight:700;font-size:12px}
.g{color:#34d399}.y{color:#fbbf24}.w{color:#94a3b8}
.sc-wrap{flex:1}
.sc-bar{width:100%;height:3px;background:#334155;border-radius:2px;margin-top:2px}
.sc-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
.dpol{padding:6px 12px;font-size:10px;color:#64748b;border-top:1px solid #334155;line-height:1.4}
.earnings-row{font-size:11px;color:#94a3b8;padding:4px 12px;border-top:1px solid #334155;background:#0f172a}
.earnings-soon{color:#f87171;font-weight:700}
.chart-area{background:#0a111e;height:130px;border-top:1px solid #334155}
.eval-sec{padding:7px 12px;border-top:1px solid #334155;background:#0a111e}
.rtag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:4px;margin-bottom:5px}
.rt-best{background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b66}
.rt-good{background:#22c55e22;color:#22c55e;border:1px solid #22c55e66}
.rt-hold{background:#f9731622;color:#fb923c;border:1px solid #f9731666}
.rt-bad{background:#ef444422;color:#f87171;border:1px solid #ef444466}
.dn-reason{font-size:10px;color:#fbbf24;line-height:1.5;padding-left:10px;position:relative}
.dn-reason::before{content:"↓";position:absolute;left:0;color:#475569}
.ev-cmt{font-size:10px;color:#94a3b8;line-height:1.5;margin-top:3px;padding-left:10px;position:relative}
.ev-cmt::before{content:"◆";position:absolute;left:0;color:#3b82f6;font-size:9px;top:1px}
.hid{display:none!important}
.card-links{display:flex;gap:5px;padding:7px 12px;border-top:1px solid #334155;flex-wrap:wrap}
.link-btn{font-size:11px;color:#60a5fa;border:1px solid #1e40af;border-radius:5px;padding:3px 9px;text-decoration:none;background:#1e3a5f;font-weight:600}
.link-btn:hover{background:#1e40af}
.chk-wrap{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;padding:5px 12px;border-top:1px solid #334155;background:#0f172a}
.chk-wrap input{width:15px;height:15px;accent-color:#3b82f6;cursor:pointer;flex-shrink:0}
.chk-wrap span{font-size:11px;color:#64748b}
.card.checked{border-color:#3b82f6;box-shadow:0 0 0 1px #3b82f6}
.card.checked .chk-wrap span{color:#93c5fd}
</style>
</head>
<body>
<header>
  <h1>高配当監視リスト</h1>
  <span class="upd" id="upd"></span>
</header>
<div class="bar">
  <div class="srch-wrap">
    <input class="srch" id="srch" type="text" placeholder="銘柄名・コード">
    <button class="srch-clear" id="srch-clear" onclick="clearSrch()" title="クリア">✕</button>
  </div>
  <span class="sep">|</span>
  <span style="font-size:11px;color:#64748b">ソート:</span>
  <button class="btn" id="btn-rating"  onclick="sortBy('rating',this)">評価順</button>
  <button class="btn" id="btn-pri"     onclick="sortBy('priority',this)">優先</button>
  <button class="btn" id="btn-sec"     onclick="sortBy('sector',this)">セクター</button>
  <button class="btn on" id="btn-bot"  onclick="sortBy('bottom',this)">底値スコア</button>
  <button class="btn" id="btn-div"     onclick="sortBy('div',this)">配当利回り</button>
  <button class="btn" id="btn-chk"     onclick="sortBy('checked',this)">✔チェック順</button>
  <span class="sep">|</span>
  <span style="font-size:11px;color:#64748b">絞込:</span>
  <button class="btn on" id="f-all"    onclick="filterBy('all',this)">全て</button>
  <button class="btn bottom-btn" id="f-bot" onclick="filterBy('bottom_only',this)">底値圏のみ</button>
  <button class="btn" id="f-near"      onclick="filterBy('near_only',this)">底値付近以内</button>
  <button class="btn best-btn" id="f-best" onclick="filterBy('best',this)">◎最優先</button>
  <button class="btn good-btn" id="f-good" onclick="filterBy('good',this)">○以上推奨</button>
  <span class="cnt" id="cnt"></span>
</div>
<div class="grid" id="grid"></div>
<script>
const DATA = [];
document.getElementById('upd').textContent = '更新: 09/29 23:27';

const SIG = {
  bottom_strong:'強底値',
  bottom:'底値圏',
  near_bottom:'底値付近',
  normal:'通常',
  no_data:'データなし'
};
const RTAG = {
  '◎': '<span class="rtag rt-best">◎ 最優先</span>',
  '○': '<span class="rtag rt-good">○ 推奨</span>',
  '△': '<span class="rtag rt-hold">△ 様子見</span>',
  '×': '<span class="rtag rt-bad">× 見送り</span>',
};
const RORD = {'◎':0,'○':1,'△':2,'×':3};

let curSort='bottom', curFilter='all', q='';
const WEBHOOK='https://script.google.com/macros/s/AKfycbw72oO9K3iPsR4AlLmtlr2TbXUKm4b7UFknTpvfMIJ-6IG9z5Jz-Qehwyyv5cXuBgM6/exec';
let checked=new Set();
let _saveTimer=null;
(function(){try{const s=localStorage.getItem('checked_codes_v2');if(s){JSON.parse(s).forEach(c=>checked.add(c));return;}}catch(e){}})();
(async function(){
  if(!WEBHOOK)return;
  try{
    const r=await fetch(WEBHOOK+'?type=get_checked');
    if(!r.ok)return;
    const codes=await r.json();
    if(Array.isArray(codes)&&codes.length>=0){checked=new Set(codes);localStorage.setItem('checked_codes_v2',JSON.stringify(codes));render();}
  }catch(e){}
})();
function _saveChecked(){
  const arr=[...checked];
  localStorage.setItem('checked_codes_v2',JSON.stringify(arr));
  if(!WEBHOOK)return;
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{try{await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({type:'set_checked',codes:arr})});}catch(e){}},1500);
}

document.getElementById('srch').addEventListener('input',e=>{
  q=e.target.value.toLowerCase();
  document.getElementById('srch-clear').style.display=q?'block':'none';
  render();
});
function clearSrch(){
  document.getElementById('srch').value='';
  document.getElementById('srch-clear').style.display='none';
  q='';render();
}

function sortBy(k,btn){
  curSort=k;
  document.querySelectorAll('#btn-rating,#btn-pri,#btn-sec,#btn-bot,#btn-div,#btn-chk').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function filterBy(k,btn){
  curFilter=k;
  document.querySelectorAll('#f-all,#f-bot,#f-near,#f-best,#f-good').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function getList(){
  let d=[...DATA];
  if(q) d=d.filter(s=>(s.name||'').toLowerCase().includes(q)||(s.code||'').includes(q)||(s.sector||'').includes(q));
  if(curFilter==='bottom_only') d=d.filter(s=>s.signal==='bottom_strong'||s.signal==='bottom');
  if(curFilter==='near_only')   d=d.filter(s=>['bottom_strong','bottom','near_bottom'].includes(s.signal));
  if(curFilter==='best')        d=d.filter(s=>s.rating==='◎');
  if(curFilter==='good')        d=d.filter(s=>s.rating==='◎'||s.rating==='○');
  if(curSort==='rating')   d.sort((a,b)=>{const ra=RORD[a.rating]??9,rb=RORD[b.rating]??9;return ra-rb||(b.bottom_score||0)-(a.bottom_score||0);});
  else if(curSort==='priority') d.sort((a,b)=>{const ap=a.priority==='○'?0:1,bp=b.priority==='○'?0:1;return ap-bp||(b.bottom_score||0)-(a.bottom_score||0);});
  else if(curSort==='sector')   d.sort((a,b)=>(a.sector||'').localeCompare(b.sector||'','ja')||(b.bottom_score||0)-(a.bottom_score||0));
  else if(curSort==='bottom')   d.sort((a,b)=>(b.bottom_score||0)-(a.bottom_score||0));
  else if(curSort==='div')      d.sort((a,b)=>parseFloat(b.div_yield||0)-parseFloat(a.div_yield||0));
  else if(curSort==='checked')  d.sort((a,b)=>(checked.has(b.code)?1:0)-(checked.has(a.code)?1:0));
  return d;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pflCls(v){if(v==null)return'';if(v<10)return'g';if(v<25)return'y';return'w';}
function rsiCls(v){if(v==null)return'';if(v<35)return'rlo';if(v<50)return'rmd';return'';}

function toggleCheck(code,el){
  if(checked.has(code)){checked.delete(code);}else{checked.add(code);}
  _saveChecked();
  const card=el.closest('.card');
  card.classList.toggle('checked',checked.has(code));
  el.checked=checked.has(code);
  el.nextElementSibling.textContent=checked.has(code)?'チェック済み':'チェックする';
  if(curSort==='checked') render();
}

function card(s){
  const pri=s.priority==='○';
  const sig=s.signal||'no_data';
  const score=s.bottom_score||0;
  const divY=s.div_yield?parseFloat(s.div_yield).toFixed(1)+'%':'—';
  const mktcap=s.mktcap?Number(s.mktcap).toLocaleString()+'億':'—';
  const eps=s.eps?Number(s.eps).toLocaleString()+'円':'—';
  const dps=s.dps?Number(s.dps).toLocaleString()+'円':'—';
  const pfl=s.pct_from_low, rsi=s.rsi, ma=s.ma200r;
  const isChk=checked.has(s.code);
  const evalSec = s.rating ? `<div class="eval-sec">
  ${RTAG[s.rating]||''}
  ${s.decline_reason?`<div class="dn-reason">${esc(s.decline_reason)}</div>`:''}
  ${s.eval_comment?`<div class="ev-cmt">${esc(s.eval_comment)}</div>`:''}
</div>` : '';
  return `<div class="card${pri?' pri':''} ${sig}${isChk?' checked':''}">
<div class="c-head">
  <span class="sec">${esc(s.sector)}</span>
  <div class="bgs">
    ${pri?'<span class="bg-pri">○優先</span>':''}
    <span class="bg-sig s-${sig}">${SIG[sig]||sig}</span>
  </div>
</div>
<div class="c-body">
  <div class="sname">${esc(s.name)}</div>
  <div class="scode">${esc(s.code)}</div>
  ${s.info?`<div class="info">${esc(s.info)}</div>`:''}
  <div class="mets">
    <div class="met"><span class="ml">配当利回り</span><span class="mv div">${divY}</span></div>
    <div class="met"><span class="ml">時価総額</span><span class="mv">${mktcap}</span></div>
    <div class="met"><span class="ml">EPS</span><span class="mv">${eps}</span></div>
    <div class="met"><span class="ml">1株配当</span><span class="mv">${dps}</span></div>
  </div>
</div>
<div class="tbar">
  <div class="ti"><span class="tl">現在値</span><span class="tv">${s.price||'—'}</span></div>
  <div class="ti"><span class="tl">52w安値比</span><span class="tv ${pflCls(pfl)}">${pfl!=null?'+'+pfl+'%':'—'}</span></div>
  <div class="ti"><span class="tl">RSI(14)</span><span class="tv ${rsiCls(rsi)}">${rsi!=null?rsi:'—'}</span></div>
  <div class="ti"><span class="tl">MA200比</span><span class="tv ${ma!=null&&ma<-10?'g':''}">${ma!=null?(ma>=0?'+':'')+ma+'%':'—'}</span></div>
  <div class="sc-wrap"><span class="tl">底値スコア ${score}</span><div class="sc-bar"><div class="sc-fill" style="width:${Math.min(score,100)}%"></div></div></div>
</div>
<div class="chart-area" id="chart-${esc(s.code)}" data-code="${esc(s.code)}"></div>
${evalSec}
${s.div_policy?`<div class="dpol">${esc(s.div_policy)}</div>`:''}
${(()=>{if(!s.earnings_prev&&!s.earnings_next)return'';const fd=iso=>{const[,m,d]=iso.split('-');return m+'/'+d;};let t='📅 ';if(s.earnings_prev)t+=`前回 ${fd(s.earnings_prev)}`;if(s.earnings_next){const dl=Math.round((new Date(s.earnings_next)-new Date())/86400000);const sc=dl>=0&&dl<=30?'earnings-soon':'';t+=(s.earnings_prev?' → ':'')+`次回 <span class="${sc}">${fd(s.earnings_next)}（${dl>=0?dl+'日後':Math.abs(dl)+'日前'}）</span>`;}return`<div class="earnings-row">${t}</div>`;})()}
<div class="card-links"><a class="link-btn" href="https://kabutan.jp/stock/?code=${esc(s.code)}" target="_blank">株探</a><a class="link-btn" href="https://shikiho.toyokeizai.net/stocks/${esc(s.code)}" target="_blank">四季報</a><a class="link-btn" href="https://finance.yahoo.co.jp/quote/${esc(s.code)}.T" target="_blank">Yahoo</a><a class="link-btn" href="https://www.tradingview.com/chart/?symbol=TSE:${esc(s.code)}" target="_blank">TV</a></div>
<label class="chk-wrap" onclick="event.preventDefault();toggleCheck('${esc(s.code)}',this.querySelector('input'))">
  <input type="checkbox" ${isChk?'checked':''}><span>${isChk?'チェック済み':'チェックする'}</span>
</label>
</div>`;
}

function drawSVGChart(area, bars) {
  const last = bars.slice(-60);
  const n = last.length;
  if (!n) return;
  const W = area.getBoundingClientRect().width || area.offsetWidth || 300;
  const H = 130;
  const padL=38, padR=4, padT=6, padB=6;
  const cw=W-padL-padR, ch=H-padT-padB;
  let pmin=Math.min(...last.map(b=>b.low));
  let pmax=Math.max(...last.map(b=>b.high));
  if (pmax===pmin) { pmax=pmin*1.01||pmin+1; }
  const py=p=>padT+ch*(1-(p-pmin)/(pmax-pmin));
  const px=i=>padL+(i+0.5)*(cw/n);
  const bw=Math.max(cw/n*0.65,1);
  let parts=[];
  [0,0.5,1].forEach(t=>{
    const y=padT+ch*t, p=pmax-(pmax-pmin)*t;
    parts.push(`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#1e3a5f" stroke-width="1"/>`);
    parts.push(`<text x="${padL-3}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#475569">${Math.round(p).toLocaleString()}</text>`);
  });
  last.forEach((b,i)=>{
    const x=px(i), up=b.close>=b.open;
    const col=up?'#ef4444':'#2563eb';
    const top=py(Math.max(b.open,b.close)), bot=py(Math.min(b.open,b.close));
    const bh=Math.max(bot-top,1);
    parts.push(`<line x1="${x.toFixed(1)}" y1="${py(b.high).toFixed(1)}" x2="${x.toFixed(1)}" y2="${py(b.low).toFixed(1)}" stroke="${col}" stroke-width="1"/>`);
    parts.push(`<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`);
  });
  area.innerHTML=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:${H}px;display:block">${parts.join('')}</svg>`;
}

function loadChart(area) {
  if (area.dataset.loaded==='1') return;
  area.dataset.loaded='1';
  const code=area.dataset.code;
  const s=DATA.find(x=>x.code===code);
  const bars=s&&s.bars?s.bars:[];
  if (!bars.length) { area.style.display='none'; return; }
  drawSVGChart(area, bars);
}

const _chartObs = new IntersectionObserver(entries=>{
  entries.forEach(en=>{ if(en.isIntersecting) loadChart(en.target); });
},{rootMargin:'200px'});

function render(){
  const d=getList();
  document.getElementById('cnt').textContent=d.length+'件';
  document.getElementById('grid').innerHTML=d.map(card).join('');
  document.querySelectorAll('.chart-area[data-code]').forEach(el=>_chartObs.observe(el));
}
render();
</script>
</body>
</html>
