<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>2倍スクリーナー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f0f2f5;color:#222;min-height:100vh}
.hdr{background:#1a1a2e;color:#fff;padding:10px 12px;position:sticky;top:0;z-index:100}
.hdr-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hdr-title{font-size:15px;font-weight:700}
.hdr-updated{font-size:10px;color:#aaa}
.hdr-row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.search-input{flex:1;min-width:120px;padding:7px 10px;border:none;border-radius:20px;font-size:13px;outline:none}
.update-btn{padding:7px 14px;background:#15803d;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:700;white-space:nowrap}
.update-btn:hover{background:#166534}
.tabs{display:flex;flex-wrap:wrap;background:#fff;border-bottom:2px solid #e0e0e0;position:sticky;top:84px;z-index:99}
.tab{flex:none;padding:9px 14px;font-size:12px;color:#888;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:#1a6fb3;border-bottom-color:#1a6fb3;font-weight:700}
.tab-count{font-size:10px;background:#e8e8e8;border-radius:8px;padding:1px 5px;margin-left:3px;color:#666}
.tab.active .tab-count{background:#d0e4ff;color:#1a6fb3}
.stats-bar{display:flex;gap:16px;padding:8px 14px;background:#fff7ed;border-bottom:1px solid #fed7aa;font-size:11px;color:#92400e;flex-wrap:wrap}
.stat-item{display:flex;gap:4px}
.stat-label{color:#a16207}
.stat-val{font-weight:700;color:#92400e}
.content{padding:10px 12px;max-width:1200px;margin:0 auto}
.card-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){.card-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.card-grid{grid-template-columns:1fr 1fr 1fr}}

/* カード */
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #e0e0e0}
.card.buy{border-left-color:#22c55e}
.card.pass{border-left-color:#ef4444}
.card.check{border-left-color:#f59e0b}
.card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.card-header-left{flex:1;min-width:0}
.card-header-right{text-align:right;flex-shrink:0}

/* 判定バッジ */
.verdict-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:12px;margin-bottom:5px}
.verdict-buy{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.verdict-pass{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}
.verdict-check{background:#fef9c3;color:#a16207;border:1px solid #fde047}

/* 銘柄名 */
.name-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.name{font-size:16px;font-weight:800}
.code{font-size:11px;color:#999}
.sector-tag{font-size:10px;padding:1px 6px;background:#f1f5f9;color:#475569;border-radius:5px}
.theme-tags{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 5px}
.theme-tag{font-size:10px;padding:2px 7px;background:#ede9fe;color:#5b21b6;border-radius:5px;white-space:nowrap;font-weight:600}
.biz-desc{font-size:11px;color:#444;line-height:1.5;margin-bottom:6px;padding:5px 9px;background:#f9fafb;border-radius:6px;border-left:2px solid #d1d5db}

/* リンク */
.ext-links{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.ext-link{font-size:10px;color:#fff;border-radius:4px;padding:2px 7px;text-decoration:none;white-space:nowrap;font-weight:600}
.ext-link:hover{opacity:.8}
.ext-link.yahoo{background:#720e9e}
.ext-link.kabutan{background:#d97706}
.ext-link.shikiho{background:#1d4ed8}
.ext-link.tv{background:#2962ff}

/* 株価 */
.price-val{font-size:19px;font-weight:800;line-height:1}
.change-val{font-size:12px;margin-top:2px;font-weight:600}
.pos{color:#dc2626}.neg{color:#2563eb}.neu{color:#777}

/* YTD安値バー */
.ytd-bar{display:flex;align-items:center;gap:8px;margin:6px 0;padding:6px 10px;background:#fef2f2;border-radius:8px;border-left:3px solid #ef4444}
.ytd-label{font-size:10px;color:#9f1239;font-weight:600;white-space:nowrap}
.ytd-val{font-size:12px;color:#be123c;font-weight:700}
.ytd-days{font-size:10px;color:#e11d48;background:#ffe4e6;padding:1px 6px;border-radius:8px}

/* 財務バッジ行 */
.fin-row{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.fin-badge{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600;display:flex;gap:3px;align-items:center}
.fin-ok{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.fin-ng{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.fin-na{background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb}
.fin-lbl{font-size:9px;opacity:.7}

/* AI分析ブロック */
.analysis-block{margin-top:10px;background:#f8f9fa;border-radius:8px;padding:10px 12px}
.analysis-title{font-size:10px;font-weight:700;color:#374151;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.analysis-item{display:flex;gap:6px;margin-bottom:6px;font-size:11px;line-height:1.5;color:#374151}
.analysis-item:last-child{margin-bottom:0}
.ai-num{color:#6b7280;font-weight:700;flex-shrink:0;width:14px}
.ai-text{flex:1}
.verdict-line{margin-top:8px;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:700}
.verdict-line.buy{background:#dcfce7;color:#15803d}
.verdict-line.pass{background:#fee2e2;color:#991b1b}
.verdict-line.check{background:#fef9c3;color:#92400e}

/* チャートエリア */
.chart-area{margin-top:10px;border-radius:6px;overflow:hidden;background:#fafafa;height:160px}

/* テクニカルブロック */
.tech-block{margin-top:10px;background:#f0f9ff;border-radius:8px;padding:10px 12px;border-left:3px solid #3b82f6}
.tech-title{font-size:10px;font-weight:700;color:#1e40af;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.tech-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.tech-badge{font-size:11px;padding:2px 7px;border-radius:5px;background:#dbeafe;color:#1e3a8a;font-weight:600}
.tech-badge.warn{background:#fef9c3;color:#a16207}
.tech-badge.danger{background:#fee2e2;color:#991b1b}
.tech-badge.ok{background:#d1fae5;color:#065f46}
.entry-status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:12px;margin-bottom:6px}
.es-entry{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd}
.es-watch{background:#fef9c3;color:#a16207;border:1px solid #fde047}
.es-wait {background:#f3f4f6;color:#6b7280;border:1px solid #d1d5db}
.cond-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.cond-item{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:600;display:flex;align-items:center;gap:3px}
.cond-ok  {background:#d1fae5;color:#065f46}
.cond-ng  {background:#f3f4f6;color:#9ca3af}
.exit-block{margin-top:7px;padding:7px 10px;background:#fef2f2;border-radius:6px;border-left:3px solid #ef4444}
.exit-title{font-size:10px;font-weight:700;color:#991b1b;margin-bottom:4px}
.exit-row{display:flex;flex-wrap:wrap;gap:8px;font-size:11px}
.exit-stop{color:#dc2626;font-weight:700}
.exit-tgt{color:#15803d;font-weight:700}
/* 順位バッジ */
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:800;flex-shrink:0;margin-right:4px}
.rank-1{background:#fef08a;color:#a16207;border:2px solid #eab308}
.rank-2{background:#e2e8f0;color:#374151;border:2px solid #94a3b8}
.rank-3{background:#fed7aa;color:#9a3412;border:2px solid #f97316}
.rank-n{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1;font-size:10px}
.tech-score{font-size:10px;color:#6b7280;margin-left:4px}
/* 次点理由 */
.reason-block{margin-top:8px;padding:8px 10px;background:#fafafa;border-radius:8px;border-left:3px solid #94a3b8}
.reason-title{font-size:10px;font-weight:700;color:#475569;margin-bottom:5px}
.reason-row{display:flex;flex-wrap:wrap;gap:4px}
.reason-item{font-size:10px;padding:2px 7px;border-radius:10px;display:flex;align-items:center;gap:3px}
.ri-pass{background:#d1fae5;color:#065f46}
.ri-fail{background:#fee2e2;color:#991b1b}
.ri-na  {background:#f1f5f9;color:#64748b}
/* 株探ニュース */
.news-block{margin-top:8px;padding:6px 10px;background:#fffbeb;border-radius:6px;border-left:3px solid #fbbf24}
.news-title{font-size:10px;font-weight:700;color:#92400e;margin-bottom:4px}
.news-item{font-size:10px;color:#78350f;line-height:1.6}

.sort-bar{display:flex;gap:6px;padding:7px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0;align-items:center;flex-wrap:wrap}
.sort-label{font-size:11px;color:#64748b;white-space:nowrap}
.sort-btn{font-size:11px;padding:4px 12px;border-radius:14px;border:1px solid #cbd5e1;background:#fff;color:#475569;cursor:pointer;white-space:nowrap;font-weight:600;transition:all .15s}
.sort-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
/* ランクテーブル */
.rank-table{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 6px;padding:5px 9px;background:#f8fafc;border-radius:7px;border:1px solid #e2e8f0}
.rank-item{font-size:10px;color:#64748b;display:flex;align-items:center;gap:2px}
.rank-num{font-weight:800;font-size:12px;color:#374151}
.rank-num.top3{color:#d97706}
.rank-num.top10{color:#1a6fb3}
/* 上値余地・底値ブロック */
.upside-block{margin-top:8px;padding:8px 10px;background:#f0fdf4;border-radius:8px;border-left:3px solid #22c55e}
.upside-title{font-size:10px;font-weight:700;color:#15803d;margin-bottom:5px}
.upside-row{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#374151}
.upside-pct{font-weight:800;color:#15803d}
.bottom-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:5px;font-size:11px;color:#374151;padding-top:5px;border-top:1px solid #bbf7d0}
.no-data{text-align:center;padding:40px;color:#aaa;font-size:13px}
.scroll-top{position:fixed;bottom:20px;right:16px;background:#1a6fb3;color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;z-index:200}

/* 更新モーダル */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:500px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-title{font-size:15px;font-weight:800;margin-bottom:12px;color:#1a1a2e}
.modal-cmd{background:#1a1a2e;color:#22d3ee;padding:10px 14px;border-radius:8px;font-family:monospace;font-size:12px;line-height:1.6;margin-bottom:12px;white-space:pre-wrap;word-break:break-all}
.modal-note{font-size:11px;color:#666;line-height:1.6;margin-bottom:14px}
.modal-close{padding:8px 20px;background:#1a6fb3;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row1">
    <span class="hdr-title">🎯 2倍スクリーナー</span>
    <span class="hdr-updated" id="updated-lbl"></span>
  </div>
  <div class="hdr-row2">
    <input type="text" id="search" class="search-input" placeholder="銘柄名・コード検索" oninput="render()">
    <button onclick="document.getElementById('search').value='';render();" style="background:none;border:none;font-size:16px;cursor:pointer;color:#999;padding:0 4px">×</button>
    <button class="update-btn" onclick="showUpdateModal()">🔄 更新</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="candidates" onclick="switchTab('candidates')">🎯 該当銘柄（テクニカル順） <span class="tab-count" id="cnt-candidates">0</span></div>
  <div class="tab"        data-tab="runner_ups" onclick="switchTab('runner_ups')">📊 次点 <span class="tab-count" id="cnt-runner_ups">0</span></div>
</div>

<div class="stats-bar" id="stats-bar"></div>
<div class="sort-bar">
  <span class="sort-label">並び替え:</span>
  <button class="sort-btn active" id="sort-funda"    onclick="setSort('funda')">📊 ファンダ×AI</button>
  <button class="sort-btn"        id="sort-bottom"   onclick="setSort('bottom')">📉 ①底値付近</button>
  <button class="sort-btn"        id="sort-reversal" onclick="setSort('reversal')">📈 ②底値反発確認</button>
  <button class="sort-btn"        id="sort-upside"   onclick="setSort('upside')">🎯 ③上値余地</button>
</div>
<div class="content"><div id="stock-list"></div></div>
<button class="scroll-top" id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">🔄 スクリーナー更新方法</div>
    <div class="modal-cmd">$env:PYTHONIOENCODING="utf-8"
python screening_scanner.py</div>
    <div class="modal-note">
      ※ PowerShell (C:\Users\asd10\stock_scanner) で上記を実行してください。<br>
      ※ 完了後にさらに以下を実行してHTMLを再生成します：<br>
    </div>
    <div class="modal-cmd">python generate_screening.py</div>
    <div class="modal-note">
      所要時間: スクリーニング20〜40分 + HTML生成1分<br>
      --skip-analysis オプションで財務フィルターのみ（約5分）実行可能
    </div>
    <button class="modal-close" onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
const DATA = {"candidates": [], "runner_ups": [], "stats": {}};
const UPDATED = "";
let curTab = 'candidates';
let curSort = 'funda';

function showUpdateModal(){ document.getElementById('modal-overlay').classList.add('show'); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); }

function setSort(mode){
  curSort = mode;
  ['funda','bottom','reversal','upside'].forEach(m =>
    document.getElementById('sort-'+m).classList.toggle('active', m === mode)
  );
  render();
}

function upsideScore(s) {
  const t = s.technicals || {};
  const price = s.current_price || 0;
  const upsideMa75 = t.upside_ma75 || 0;
  const upsideMa25 = t.upside_ma25 || 0;
  const sr = s.support_resistance || {resistances:[]};
  let upsideResist = 0;
  if (sr.resistances && sr.resistances.length && price > 0)
    upsideResist = Math.max((sr.resistances[0].price - price) / price * 100, 0);
  const w52high = s.weekly_52w_high || 0;
  const upside52w = (price > 0 && w52high > price) ? (w52high - price) / price * 100 : 0;
  const maxUp = Math.max(upsideMa75, upsideMa25, upsideResist, upside52w, 0);
  return fundamentalScore(s) * 3 + maxUp * 2;
}

function computeRanks(list) {
  if (!list.length) return {};
  const sorted = {
    funda:    [...list].sort((a,b) => fundamentalScore(b) - fundamentalScore(a)),
    bottom:   [...list].sort((a,b) => (fundamentalScore(b)*3+(b.bottom_proximity_score||0)) - (fundamentalScore(a)*3+(a.bottom_proximity_score||0))),
    reversal: [...list].sort((a,b) => (fundamentalScore(b)*3+(b.reversal_score||0)) - (fundamentalScore(a)*3+(a.reversal_score||0))),
    upside:   [...list].sort((a,b) => upsideScore(b) - upsideScore(a)),
  };
  const map = {};
  list.forEach(s => {
    map[s.code] = {
      funda:    sorted.funda.findIndex(x => x.code === s.code) + 1,
      bottom:   sorted.bottom.findIndex(x => x.code === s.code) + 1,
      reversal: sorted.reversal.findIndex(x => x.code === s.code) + 1,
      upside:   sorted.upside.findIndex(x => x.code === s.code) + 1,
    };
  });
  return map;
}

function fundamentalScore(s) {
  const v = s.analysis || {};
  const verdict = v.verdict || '';
  // AI判定: 買い候補=40, 要確認=15, 見送り=0
  const verdictScore = verdict.includes('買い') ? 40 : verdict.includes('見送') ? 0 : 15;
  // ファンダ条件クリア数 × 8
  const passScore = (s.pass_count || 0) * 8;
  // 割安度: PERが低いほど高点（最大20点）
  const perScore = s.per && s.per > 0 ? Math.min(Math.max(25 - s.per, 0), 20) : 0;
  // 収益力: ROEが高いほど高点（最大15点）
  const roeScore = s.roe ? Math.min(s.roe * 0.5, 15) : 0;
  // 自己資本比率: 高いほど高点（最大10点）
  const eqScore = s.equity_ratio ? Math.min((s.equity_ratio - 40) * 0.2, 10) : 0;
  return verdictScore + passScore + perScore + roeScore + eqScore;
}

function switchTab(tab){
  curTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  render();
}

function techScore(s) {
  const t = s.technicals || {};
  return (t.entry_count || 0) * 10
    + (t.entry_status === 'エントリー好機' ? 5 : t.entry_status === '監視継続' ? 2 : 0)
    + (t.upside_ma75 ? Math.min(t.upside_ma75 / 10, 3) : 0);
}

function render(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const list = DATA[curTab] || [];

  // 全銘柄のランクを事前計算（検索フィルター前）
  const rankMap = computeRanks(list);

  let filtered = q ? list.filter(s => s.name.toLowerCase().includes(q) || s.code.includes(q)) : [...list];

  if (curSort === 'bottom') {
    filtered.sort((a,b) => (fundamentalScore(b)*3+(b.bottom_proximity_score||0)) - (fundamentalScore(a)*3+(a.bottom_proximity_score||0)));
  } else if (curSort === 'reversal') {
    filtered.sort((a,b) => (fundamentalScore(b)*3+(b.reversal_score||0)) - (fundamentalScore(a)*3+(a.reversal_score||0)));
  } else if (curSort === 'upside') {
    filtered.sort((a,b) => upsideScore(b) - upsideScore(a));
  } else {
    filtered.sort((a,b) => fundamentalScore(b) - fundamentalScore(a));
  }

  // タブカウント更新
  document.getElementById('cnt-candidates').textContent = DATA.candidates?.length || 0;
  document.getElementById('cnt-runner_ups').textContent = DATA.runner_ups?.length || 0;

  const el = document.getElementById('stock-list');
  if (!filtered.length){
    el.innerHTML = '<div class="no-data">該当銘柄なし</div>';
    return;
  }

  el.innerHTML = '<div class="card-grid">' + filtered.map((s, i) => renderCard(s, i+1, rankMap[s.code])).join('') + '</div>';

  // チャート描画
  filtered.forEach(s => {
    if (s.bars && s.bars.length) {
      try { renderChart('chart-'+s.code, s.bars); } catch(e){}
    }
  });
}

function renderCard(s, rank, ranks){
  const v = s.analysis || {};
  const verdict = v.verdict || '要確認';
  const verdictCls = verdict.includes('買い') ? 'buy' : verdict.includes('見送') ? 'pass' : 'check';
  const verdictIcon = verdict.includes('買い') ? '🟢' : verdict.includes('見送') ? '🔴' : '🟡';

  const priceStr = s.current_price ? Math.round(s.current_price).toLocaleString() : '---';
  const chgStr   = s.change_pct != null ? (s.change_pct >= 0 ? '+' : '') + s.change_pct.toFixed(2) + '%' : '';
  const chgCls   = s.change_pct > 0 ? 'pos' : s.change_pct < 0 ? 'neg' : 'neu';

  const ytdPrice = s.ytd_low ? Math.round(s.ytd_low).toLocaleString() : '---';
  const ytdDays  = s.ytd_low_days_ago != null ? s.ytd_low_days_ago + '日前' : '';
  const ytdDate  = s.ytd_low_date || '';

  function finBadge(label, val, unit, ok){
    const cls = val == null ? 'fin-na' : (ok ? 'fin-ok' : 'fin-ng');
    const disp = val != null ? val + unit : 'N/A';
    return `<span class="fin-badge ${cls}"><span class="fin-lbl">${label}</span>${disp}</span>`;
  }
  const ch = s.checks || {};
  const finRow = [
    finBadge('ROE', s.roe, '%', ch.roe),
    finBadge('利益率', s.op_margin, '%', ch.op_margin),
    finBadge('自己資本', s.equity_ratio, '%', ch.equity_ratio),
    finBadge('PER', s.per, '倍', ch.per),
  ].join('');

  // 4モードのランク行
  const rankRowHtml = (() => {
    if (!ranks) return '';
    const items = [
      {label:'📊ファンダ', key:'funda'},
      {label:'📉①底値',   key:'bottom'},
      {label:'📈②反発',   key:'reversal'},
      {label:'🎯③上値',   key:'upside'},
    ];
    return `<div class="rank-table">${items.map(item => {
      const r = ranks[item.key];
      const cls = r <= 3 ? ' top3' : r <= 10 ? ' top10' : '';
      return `<span class="rank-item">${item.label}<span class="rank-num${cls}">${r}位</span></span>`;
    }).join('')}</div>`;
  })();

  // 上値余地・底値ブロック
  const upsideHtml = (() => {
    const t = s.technicals || {};
    const price = s.current_price || 0;
    const sr = s.support_resistance || {resistances:[]};
    const targets = [];
    if (t.target_ma25 && t.upside_ma25 > 0)
      targets.push({label:'MA25', price:t.target_ma25, pct:t.upside_ma25});
    if (t.target_ma75 && t.upside_ma75 > 0)
      targets.push({label:'MA75', price:t.target_ma75, pct:t.upside_ma75});
    if (sr.resistances && sr.resistances.length && price > 0) {
      const pct = ((sr.resistances[0].price - price) / price * 100);
      if (pct > 0) targets.push({label:'抵抗線', price:sr.resistances[0].price, pct:pct.toFixed(1)});
    }
    const w52high = s.weekly_52w_high;
    if (w52high && price > 0 && w52high > price) {
      const pct = ((w52high - price) / price * 100);
      targets.push({label:'52週高値', price:w52high, pct:pct.toFixed(1)});
    }
    const dailyLow  = s.ytd_low;
    const weeklyLow = s.weekly_52w_low;
    if (!targets.length && !dailyLow) return '';
    const targetHtml = targets.map(tgt =>
      `<span>🎯 ${tgt.label}: ¥${Math.round(tgt.price).toLocaleString()} <b class="upside-pct">+${typeof tgt.pct==='number'?tgt.pct.toFixed(1):tgt.pct}%</b></span>`
    ).join('');
    const bottomHtml = (dailyLow || weeklyLow) ? `<div class="bottom-row">
      ${dailyLow  ? `<span>底値(日足): <b>¥${Math.round(dailyLow).toLocaleString()}</b></span>` : ''}
      ${weeklyLow ? `<span>底値(週足): <b>¥${Math.round(weeklyLow).toLocaleString()}</b></span>` : ''}
    </div>` : '';
    return `<div class="upside-block">
      <div class="upside-title">📐 上値余地・底値</div>
      <div class="upside-row">${targetHtml}</div>
      ${bottomHtml}
    </div>`;
  })();

  // テーマタグ（株探）または業種タグ（yfinance fallback）
  const themedHtml = (() => {
    const themes = s.kabutan_themes || [];
    if (themes.length) {
      return `<div class="theme-tags">${themes.slice(0,6).map(t=>`<span class="theme-tag">${t}</span>`).join('')}</div>`;
    }
    if (s.sector) {
      return `<div class="theme-tags"><span class="sector-tag">${s.sector}</span></div>`;
    }
    return '';
  })();

  // 業務概要（株探コメント）
  const bizDescHtml = (() => {
    const desc = s.kabutan_comment || '';
    if (!desc) return '';
    const txt = desc.length > 90 ? desc.slice(0,90) + '…' : desc;
    return `<div class="biz-desc">${txt}</div>`;
  })();

  const links = [
    `<a class="ext-link yahoo"   href="https://finance.yahoo.co.jp/quote/${s.code}.T"   target="_blank">Y</a>`,
    `<a class="ext-link kabutan" href="https://kabutan.jp/stock/?code=${s.code}"         target="_blank">株探</a>`,
    `<a class="ext-link shikiho" href="https://shikiho.toyokeizai.net/stocks/${s.code}" target="_blank">四季報</a>`,
    `<a class="ext-link tv"      href="https://www.tradingview.com/chart/?symbol=TSE:${s.code}" target="_blank">TV</a>`,
  ].join('');

  const techHtml = (() => {
    const t  = s.technicals;
    const wt = s.weekly_technicals || {};
    const sr = s.support_resistance || {supports:[], resistances:[]};
    if (!t || !t.rsi) return '';

    const statusCls = t.entry_status === 'エントリー好機' ? 'es-entry' : t.entry_status === '監視継続' ? 'es-watch' : 'es-wait';
    const statusIcon = t.entry_status === 'エントリー好機' ? '🔵' : t.entry_status === '監視継続' ? '🟡' : '⚪';

    const maRow = [
      t.ma5  ? `MA5: ¥${t.ma5.toLocaleString()}${t.ma5_up ? '↗' : '↘'}` : null,
      t.ma25 ? `MA25: ¥${t.ma25.toLocaleString()}` : null,
      t.ma75 ? `MA75: ¥${t.ma75.toLocaleString()}` : null,
    ].filter(Boolean).map(x => `<span class="tech-badge">${x}</span>`).join('');

    const indRow = [
      t.rsi  != null ? `<span class="tech-badge${t.rsi<=35?' ok':t.rsi>=70?' danger':''}"}>RSI: ${t.rsi}</span>` : '',
      t.bb_lower ? `<span class="tech-badge">BB: ¥${t.bb_lower}〜¥${t.bb_upper}</span>` : '',
      t.macd != null ? `<span class="tech-badge${t.macd_hist>0?' ok':' danger'}">MACD: ${t.macd}(${t.macd_hist>0?'+':''}${t.macd_hist})</span>` : '',
      t.vol_ratio ? `<span class="tech-badge${t.vol_ratio>=1.5?' ok':''}">出来高: ${t.vol_ratio}x</span>` : '',
    ].filter(Boolean).join('');

    const condRow = (t.entry_signals||[]).map(sig =>
      `<span class="cond-item ${sig.ok?'cond-ok':'cond-ng'}">${sig.ok?'✅':'⬜'} ${sig.label}</span>`
    ).join('');

    // 週足テクニカル
    const weeklyHtml = (() => {
      if (!wt.rsi) return '';
      const rsiCls = wt.rsi <= 30 ? ' ok' : wt.rsi >= 70 ? ' danger' : '';
      const parts = [`<span class="tech-badge${rsiCls}">週足RSI: ${wt.rsi}</span>`];
      if (wt.ma5_up !== undefined) parts.push(`<span class="tech-badge${wt.ma5_up?' ok':' danger'}">週足MA5: ${wt.ma5_up?'↗上向き':'↘下向き'}</span>`);
      if (wt.macd_hist != null) parts.push(`<span class="tech-badge${wt.macd_hist>0?' ok':' danger'}">週足MACD: ${wt.macd_hist>0?'+':''}${wt.macd_hist}</span>`);
      return `<div class="tech-row">${parts.join('')}</div>`;
    })();

    // サポート・レジスタンス
    const srHtml = (() => {
      const { supports, resistances } = sr;
      if (!supports.length && !resistances.length) return '';
      const supStr = supports.map(x=>`<b style="color:#15803d">▲¥${x.price.toLocaleString()}</b>`).join(' ');
      const resStr = resistances.map(x=>`<b style="color:#dc2626">▼¥${x.price.toLocaleString()}</b>`).join(' ');
      return `<div style="margin-top:5px;padding:5px 8px;background:#f0fdf4;border-radius:5px;font-size:11px;display:flex;flex-wrap:wrap;gap:12px">
        ${supports.length    ? `<span>サポート: ${supStr}</span>` : ''}
        ${resistances.length ? `<span>レジスタンス: ${resStr}</span>` : ''}
      </div>`;
    })();

    // 底値スコア表示
    const scoreHtml = (() => {
      const bs = s.bottom_proximity_score || 0;
      const rs = s.reversal_score || 0;
      if (!bs && !rs) return '';
      return `<div style="margin-top:5px;display:flex;gap:8px;font-size:10px;color:#6b7280">
        <span>底値付近スコア: <b style="color:${bs>=50?'#dc2626':bs>=30?'#f59e0b':'#6b7280'}">${bs}</b></span>
        <span>反発確認スコア: <b style="color:${rs>=60?'#15803d':rs>=35?'#3b82f6':'#6b7280'}">${rs}</b></span>
      </div>`;
    })();

    const exitHtml = (() => {
      const parts = [];
      if (t.stop_loss) parts.push(`<span class="exit-stop">🛑 損切: ¥${t.stop_loss.toLocaleString()}</span>`);
      if (t.target_ma25 && t.upside_ma25) parts.push(`<span class="exit-tgt">🎯 短期(MA25): ¥${t.target_ma25.toLocaleString()} +${t.upside_ma25}%</span>`);
      if (t.target_ma75 && t.upside_ma75) parts.push(`<span class="exit-tgt">🎯 中期(MA75): ¥${t.target_ma75.toLocaleString()} +${t.upside_ma75}%</span>`);
      if (!parts.length) return '';
      return `<div class="exit-block"><div class="exit-title">📍 エントリー・撤退ライン</div><div class="exit-row">${parts.join('')}</div></div>`;
    })();

    return `<div class="tech-block">
      <div class="tech-title">📈 テクニカル分析 &nbsp;<span class="entry-status ${statusCls}">${statusIcon} ${t.entry_status} (${t.entry_count}/5)</span></div>
      <div class="tech-row">${maRow}</div>
      <div class="tech-row">${indRow}</div>
      ${weeklyHtml}
      <div class="cond-row">${condRow}</div>
      ${srHtml}
      ${scoreHtml}
      ${exitHtml}
    </div>`;
  })();

  const declineHtml = (() => {
    const bars = s.bars || [];
    if (bars.length < 5) return '';
    const closes = bars.map(b => b.close);
    const highs   = bars.map(b => b.high);
    const n = closes.length;
    const cur  = closes[n-1];
    const ytdHigh  = Math.max(...highs);
    const ytdHighDate = bars[highs.indexOf(ytdHigh)]?.time || '';
    const dropFromHigh = ((cur - ytdHigh) / ytdHigh * 100).toFixed(1);
    const chg5  = n>=5  ? ((cur - closes[n-6])  / closes[n-6]  * 100).toFixed(1) : null;
    const chg20 = n>=20 ? ((cur - closes[n-21]) / closes[n-21] * 100).toFixed(1) : null;
    // 連続陰線数
    let consecutive = 0;
    for (let i = n-1; i >= 1; i--) {
      if (closes[i] < closes[i-1]) consecutive++;
      else break;
    }
    const parts = [
      `<span style="color:#dc2626;font-weight:700">年初来高値 ¥${Math.round(ytdHigh).toLocaleString()} から ${dropFromHigh}%下落</span>`,
      chg5  ? `<span>直近5日: <b style="color:${chg5<0?'#dc2626':'#15803d'}">${chg5}%</b></span>` : '',
      chg20 ? `<span>直近20日: <b style="color:${chg20<0?'#dc2626':'#15803d'}">${chg20}%</b></span>` : '',
      consecutive >= 3 ? `<span style="color:#9f1239">⚠️ ${consecutive}日連続陰線</span>` : '',
    ].filter(Boolean);
    return `<div style="margin-top:8px;padding:7px 10px;background:#fff1f2;border-radius:8px;border-left:3px solid #fda4af">
      <div style="font-size:10px;font-weight:700;color:#be123c;margin-bottom:4px">📉 直近の下落状況</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#374151">${parts.join('')}</div>
    </div>`;
  })();

  const reasonHtml = (() => {
    const THRESHOLDS = [
      {key:'roe',          label:'ROE',      val:s.roe,          threshold:'10%以上',  ok:s.checks?.roe},
      {key:'op_margin',    label:'営業利益率', val:s.op_margin,    threshold:'8%以上',   ok:s.checks?.op_margin},
      {key:'equity_ratio', label:'自己資本比率',val:s.equity_ratio, threshold:'40%以上',  ok:s.checks?.equity_ratio},
      {key:'per',          label:'PER',       val:s.per,          threshold:'30倍以下', ok:s.checks?.per},
    ];
    const items = THRESHOLDS.map(c => {
      if (c.val == null) {
        return `<span class="reason-item ri-na">❓ ${c.label} データなし</span>`;
      }
      const unit = c.key === 'per' ? '倍' : '%';
      const disp = `${c.label} ${c.val}${unit}`;
      return c.ok
        ? `<span class="reason-item ri-pass">✅ ${disp}</span>`
        : `<span class="reason-item ri-fail">❌ ${disp}（条件: ${c.threshold}）</span>`;
    }).join('');
    const passN = THRESHOLDS.filter(c=>c.ok).length;
    const naN   = THRESHOLDS.filter(c=>c.val==null).length;
    const label = naN === 4 ? '財務データ未取得（次回スキャンで取得）'
                : passN === 4 ? '全条件クリア'
                : `${passN}/4条件クリア`;
    return `<div class="reason-block">
      <div class="reason-title">📋 ファンダメンタル判定：${label}</div>
      <div class="reason-row">${items}</div>
    </div>`;
  })();

  const newsHtml = (() => {
    const news = s.kabutan_news || [];
    if (!news.length) return '';
    const items = news.slice(0,3).map(n => `<div class="news-item">・${n.date} ${n.title}</div>`).join('');
    return `<div class="news-block"><div class="news-title">📰 株探ニュース</div>${items}</div>`;
  })();

  const analysisHtml = (() => {
    if (!v.reason_low && !v.performance) return '';
    const vl = `<div class="verdict-line ${verdictCls}">${verdictIcon} ${verdict}：${v.verdict_reason||''}</div>`;
    return `<div class="analysis-block">
      <div class="analysis-title">🤖 AI分析</div>
      <div class="analysis-item"><span class="ai-num">①</span><span class="ai-text"><b>売られ理由：</b>${v.reason_low||''}</span></div>
      <div class="analysis-item"><span class="ai-num">②</span><span class="ai-text"><b>業績見通し：</b>${v.performance||''}</span></div>
      <div class="analysis-item"><span class="ai-num">③</span><span class="ai-text"><b>割安度：</b>${v.valuation||''}</span></div>
      ${vl}
    </div>`;
  })();

  return `<div class="card ${verdictCls}">
    <div class="card-header">
      <div class="card-header-left">
        <span class="verdict-badge verdict-${verdictCls}">${verdictIcon} ${verdict}</span>
        <div class="name-row">
          ${rank ? `<span class="rank-badge ${rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'rank-n'}">${rank}</span>` : ''}
          <span class="name">${s.name||s.code}</span>
          <span class="code">${s.code}</span>
          ${rank ? `<span class="tech-score">テクニカル ${(s.technicals||{}).entry_count||0}/5</span>` : ''}
        </div>
        ${themedHtml}
        ${bizDescHtml}
        ${rankRowHtml}
        <div class="ext-links">${links}</div>
      </div>
      <div class="card-header-right">
        <div class="price-val">¥${priceStr}</div>
        <div class="change-val ${chgCls}">${chgStr}</div>
      </div>
    </div>

    <div class="ytd-bar">
      <span class="ytd-label">年初来安値</span>
      <span class="ytd-val">¥${ytdPrice}</span>
      <span class="ytd-days">${ytdDays}</span>
      <span style="font-size:10px;color:#9f1239;margin-left:auto">${ytdDate}</span>
    </div>

    <div class="fin-row">${finRow}</div>

    ${upsideHtml}
    ${declineHtml}
    ${analysisHtml}
    ${reasonHtml}
    ${techHtml}
    ${newsHtml}

    <div class="chart-area" id="chart-${s.code}"></div>
  </div>`;
}

// ── SVGチャート（CDN不要・watchlistと同じ実装）──────────
function drawSVGChart(area, bars) {
  const last = bars.slice(-60);
  const n = last.length;
  if (!n) return;
  const W = area.getBoundingClientRect().width || area.offsetWidth || (window.innerWidth - 56) || 300;
  const H = 160;
  const padL = 40, padR = 4, padT = 6, padB = 18;
  const cw = W - padL - padR, ch = H - padT - padB;
  let pmin = Math.min(...last.map(b=>b.low));
  let pmax = Math.max(...last.map(b=>b.high));
  if (pmax === pmin) { pmax = pmin * 1.01 || pmin + 1; }
  const py = p => padT + ch * (1 - (p - pmin) / (pmax - pmin));
  const px = i => padL + (i + 0.5) * (cw / n);
  const bw = Math.max(cw / n * 0.65, 1);
  function calcMA(period) {
    const vals = [];
    for (let i = 0; i < bars.length; i++) {
      if (i < period - 1) { vals.push(null); continue; }
      vals.push(bars.slice(i-period+1, i+1).reduce((s,b)=>s+b.close,0)/period);
    }
    return vals.slice(-n);
  }
  function drawMA(vals, color) {
    let d = '', on = false;
    vals.forEach((v,i) => {
      if (v===null){on=false;return;}
      const pt = `${px(i).toFixed(1)},${py(v).toFixed(1)}`;
      d += on ? `L${pt}` : `M${pt}`; on=true;
    });
    return d ? `<path d="${d}" stroke="${color}" stroke-width="1.5" fill="none" opacity="0.9"/>` : '';
  }
  const clipId = 'c'+Math.random().toString(36).slice(2,8);
  let parts = [];
  parts.push(`<defs><clipPath id="${clipId}"><rect x="${padL}" y="${padT}" width="${cw}" height="${ch}"/></clipPath></defs>`);
  [0,0.5,1].forEach(t => {
    const y = padT + ch*t, p = pmax - (pmax-pmin)*t;
    parts.push(`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#ececec" stroke-width="1"/>`);
    parts.push(`<text x="${padL-3}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#bbb">${Math.round(p).toLocaleString()}</text>`);
  });
  last.forEach((b,i) => {
    const x=px(i), up=b.close>=b.open, col=up?'#ef4444':'#2563eb';
    const top=py(Math.max(b.open,b.close)), bot=py(Math.min(b.open,b.close)), bh=Math.max(bot-top,1);
    parts.push(`<line x1="${x.toFixed(1)}" y1="${py(b.high).toFixed(1)}" x2="${x.toFixed(1)}" y2="${py(b.low).toFixed(1)}" stroke="${col}" stroke-width="1"/>`);
    parts.push(`<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`);
  });
  parts.push(`<g clip-path="url(#${clipId})">${drawMA(calcMA(5),'#f59e0b')}${drawMA(calcMA(25),'#22c55e')}${drawMA(calcMA(75),'#a78bfa')}</g>`);
  const ly = H-4;
  parts.push(`<text x="${padL}" y="${ly}" font-size="8" fill="#f59e0b">MA5</text><text x="${padL+22}" y="${ly}" font-size="8" fill="#22c55e">MA25</text><text x="${padL+50}" y="${ly}" font-size="8" fill="#a78bfa">MA75</text>`);
  area.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:${H}px;display:block">${parts.join('')}</svg>`;
}
function renderChart(containerId, bars) {
  setTimeout(() => {
    const el = document.getElementById(containerId);
    if (!el || !bars || !bars.length) return;
    drawSVGChart(el, bars);
  }, 50);
}

// ── 初期化 ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (UPDATED) {
    const d = new Date(UPDATED);
    document.getElementById('updated-lbl').textContent =
      `更新: ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  const stats = DATA.stats || {};
  const sb = document.getElementById('stats-bar');
  if (sb) sb.innerHTML = [
    `<span class="stat-item"><span class="stat-label">スクリーニング対象:</span><span class="stat-val">${(stats.total_screened||0).toLocaleString()}銘柄</span></span>`,
    `<span class="stat-item"><span class="stat-label">年初来安値:</span><span class="stat-val">${stats.ytd_low||0}銘柄</span></span>`,
    `<span class="stat-item"><span class="stat-label">全条件クリア:</span><span class="stat-val">${stats.candidates||0}銘柄</span></span>`,
    `<span class="stat-item"><span class="stat-label">次点(3/4条件):</span><span class="stat-val">${stats.runner_ups||0}銘柄</span></span>`,
  ].join('');

  render();
  window.addEventListener('scroll', () => {
    document.getElementById('scroll-top').style.display = window.scrollY > 400 ? 'block' : 'none';
  });
});
</script>
